<html lang="en">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#05080d;--panel:#0b1119;--panel2:#101923;--line:#1c2a38;--text:#f4f7fb;--muted:#91a0b2;--blue:#35a9ff;--blue2:#0d75c9;--blueSoft:rgba(53,169,255,.14);--red:#ff3b4f;--green:#39d98a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Manrope',Arial,sans-serif;background:radial-gradient(circle at 75% 0%,rgba(20,111,190,.16),transparent 32%),radial-gradient(circle at 15% 100%,rgba(53,169,255,.08),transparent 30%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:rgba(5,9,14,.94);color:#fff;padding:24px 14px;overflow:auto;border-right:1px solid var(--line);backdrop-filter:blur(18px);z-index:10}.logo{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:38px;line-height:1;padding:0 12px 8px}.logo b{color:var(--blue)}.logo:after{content:'STRONGER MIND  •  STRONGER YOU';display:block;font-family:'Manrope',sans-serif;color:#6f8094;font-size:9px;letter-spacing:3px;margin-top:10px}.nav{margin-top:26px}.nav button{width:100%;padding:13px;margin:4px 0;border-radius:10px;background:transparent;color:#b8c4d1;text-align:left;font-weight:600;transition:.2s}.nav button:hover{background:#0d1823;color:#fff;transform:translateX(2px)}.nav button.active{background:linear-gradient(90deg,rgba(53,169,255,.24),rgba(53,169,255,.07));color:#fff;box-shadow:inset 3px 0 0 var(--blue)}
.main{margin-left:245px;width:calc(100% - 245px);padding:26px 30px 45px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.top h1{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;margin:0 0 3px}h2,h3{margin-top:0}h2{font-family:'Bebas Neue',sans-serif;letter-spacing:.8px;font-size:28px}.muted{color:var(--muted)}
.card{background:linear-gradient(145deg,rgba(16,25,35,.96),rgba(8,13,19,.96));border:1px solid var(--line);border-radius:16px;padding:21px;margin-bottom:17px;box-shadow:0 16px 45px rgba(0,0,0,.22)}.card:hover{border-color:#263c51}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.tile{background:linear-gradient(150deg,#111c28,#080d13);border:1px solid var(--line);border-radius:15px;padding:20px;min-height:140px;cursor:pointer;transition:.22s;position:relative;overflow:hidden}.tile:after{content:'';position:absolute;width:90px;height:90px;right:-35px;bottom:-35px;border-radius:50%;background:rgba(53,169,255,.12);filter:blur(4px)}.tile:hover{transform:translateY(-3px);border-color:rgba(53,169,255,.7);box-shadow:0 15px 35px rgba(0,0,0,.3)}.tile i{font-style:normal;font-size:29px}.tile strong{display:block;font-size:17px;margin:12px 0 6px}.tile span{font-size:13px;color:var(--muted)}
.btn{background:#141e28;color:#eaf2fa;padding:10px 15px;border-radius:9px;font-weight:800;border:1px solid #223344;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:#3c5a72}.primary{background:linear-gradient(135deg,#48b4ff,#147fd0);color:#03101a;border-color:transparent;box-shadow:0 8px 25px rgba(53,169,255,.2)}.primary:hover{box-shadow:0 10px 30px rgba(53,169,255,.35)}.danger{background:rgba(255,59,79,.12);color:#ff8090;border-color:rgba(255,59,79,.3)}.green{background:rgba(57,217,138,.12);color:#64e8a6;border-color:rgba(57,217,138,.3)}.dark{background:#05080d;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{margin-bottom:13px}.form label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#aebccc;text-transform:uppercase;letter-spacing:.4px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #223344;border-radius:9px;background:#081019;color:#f5f8fb;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,169,255,.1)}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:#0e1721;color:#aebccc;padding:10px 14px;border-radius:8px;border:1px solid #1c2b39;font-weight:700}.tabs button.active{background:var(--blue);color:#03101a;border-color:var(--blue)}
.notice{padding:16px;border-radius:12px;background:rgba(53,169,255,.08);border-left:4px solid var(--blue);line-height:1.55}.warn{background:rgba(255,183,77,.08);border-left-color:#ffb74d}.help{background:rgba(255,59,79,.08);border-left-color:var(--red)}.good{background:rgba(57,217,138,.08);border-left-color:var(--green)}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#09111a}.itemhead{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#15202b;color:#b9c7d5;font-size:12px;font-weight:800}.badge.ok{background:rgba(57,217,138,.12);color:#64e8a6}.badge.bad{background:rgba(255,59,79,.12);color:#ff8090}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{padding:15px;background:#09121b;border:1px solid var(--line);border-radius:11px}.stat b{display:block;font-size:25px;margin-bottom:4px}.empty{text-align:center;padding:30px;color:#728294}.login{max-width:430px;margin:9vh auto}.breath{min-height:430px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.circle{height:180px;width:180px;border-radius:50%;background:radial-gradient(circle,#35a9ff33,#35a9ff08 58%,transparent 60%);border:1px solid #35a9ff88;box-shadow:0 0 60px rgba(53,169,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;transition:transform 1s ease}.circle.in{transform:scale(1.25)}.circle.out{transform:scale(.82)}.timer{font-size:40px;font-weight:800;margin:20px}.phase{font-size:18px;font-weight:800;margin-bottom:18px}.score{text-align:center;background:#091522;border:1px solid #20384d;border-radius:14px;padding:25px}.score strong{font-size:52px;color:var(--blue)}.question{padding:18px;background:#09121b;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}.rangeValue{font-size:20px;font-weight:800;color:var(--blue)}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #1c2936;text-align:left;font-size:13px}th{background:#0d1720;color:#aebccc}.chart{width:100%;height:240px;border:1px solid #1d3040;border-radius:12px;background:#071019}.post{border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:11px;background:#09121b}.post img{max-width:100%;max-height:330px;border-radius:9px;margin-top:10px}.feature{padding:18px;border-radius:13px;background:#09121b;border:1px solid var(--line);margin-bottom:12px}.feature h3{margin-bottom:7px;color:#fff}
.hero{position:relative;overflow:hidden;min-height:360px;border-radius:18px;border:1px solid #1b3347;background:radial-gradient(circle at 76% 48%,rgba(53,169,255,.18),transparent 22%),linear-gradient(105deg,#09131d 0%,#0a1118 55%,#07111b 100%);padding:42px;display:flex;align-items:center;margin-bottom:18px}.hero:before{content:'';position:absolute;right:-5%;top:-25%;width:48%;height:160%;background:linear-gradient(135deg,transparent 20%,rgba(53,169,255,.07),transparent 70%);transform:rotate(-12deg)}.heroContent{position:relative;z-index:3;max-width:620px}.heroKicker{text-transform:uppercase;letter-spacing:4px;color:#8da2b5;font-size:10px;font-weight:800;margin-bottom:15px}.heroTitle{font-family:'Bebas Neue',sans-serif;font-size:78px;line-height:.88;letter-spacing:2px;margin:0}.heroTitle span{color:var(--blue)}.heroText{font-size:15px;color:#b8c5d2;line-height:1.65;margin:18px 0 23px}.heroWoman{position:absolute;right:7%;bottom:0;width:290px;height:330px;z-index:2;filter:drop-shadow(0 20px 45px rgba(0,0,0,.55))}.heroWoman .hair{fill:#1a1110}.heroWoman .skin{fill:#c99578}.heroWoman .body{fill:#12171d}.heroWoman .tat{fill:#2f4658}.quote{font-family:'Bebas Neue';letter-spacing:1px;font-size:30px;color:#e8eef5;border-left:3px solid var(--blue);padding-left:18px}.sectionGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.sectionGrid .tile{min-height:175px}.langSelect{min-width:135px;background:#0b151f;color:#fff;border:1px solid #22384b;border-radius:8px;padding:9px 10px;font-weight:700}.topRight{display:flex;align-items:center;gap:8px}
@media(max-width:1050px){.sectionGrid{grid-template-columns:repeat(2,1fr)}.heroWoman{opacity:.45;right:0}}@media(max-width:800px){.side{width:68px;padding:20px 8px}.logo{font-size:23px;padding-left:8px}.logo:after{display:none}.nav span{display:none}.nav button{text-align:center;padding:13px 6px}.main{margin-left:68px;width:calc(100% - 68px);padding:16px}.hero{padding:28px 22px;min-height:330px}.heroTitle{font-size:56px}.heroWoman{display:none}.sectionGrid{grid-template-columns:1fr}.top{align-items:flex-start}.topRight{flex-direction:column;align-items:flex-end}}

function startBreath(type,name){

clearInterval(breathTimer);

breathSeconds=60;
breathRunning=true;

let area=document.getElementById("breathArea");

area.innerHTML=`

<div class="card breath">

<h2>${esc(name)}</h2>

<div class="circle in" id="breathCircle">
Вдох
</div>

<div class="timer" id="breathTimer">
01:00
</div>

<div class="phase" id="breathPhase">
Вдох · 4 секунды
</div>

<p id="breathInstruction">
Медленно вдохни через нос.
</p>

<div class="actions">

<button class="btn"
onclick="pauseBreath()">
Ⅱ Пауза
</button>

<button class="btn danger"
onclick="stopBreath()">
Остановить
</button>

</div>

<br>

<div class="notice">

🎵 <b>Background sound</b><br>
<button class="btn" onclick="toggleBreathSound()">🔊 Toggle sound</button>

</div>

</div>
`;

let cycle=12;
let elapsed=0;

breathTimer=setInterval(()=>{

if(!breathRunning)return;

breathSeconds--;
elapsed++;

let pos=(elapsed-1)%cycle;

let phase;

if(pos<4){

phase="in";

}else if(pos<6){

phase="hold";

}else{

phase="out";

}

let circle=document.getElementById("breathCircle");
let phaseText=document.getElementById("breathPhase");
let instruction=document.getElementById("breathInstruction");

if(!circle)return;

if(phase==="in"){

circle.className="circle in";
circle.textContent="Вдох";

phaseText.textContent="Вдох · 4 секунды";
instruction.textContent=
"Медленно вдохни через нос.";

}

if(phase==="hold"){

circle.className="circle";
circle.textContent="Задержка";

phaseText.textContent="Задержка · 2 секунды";
instruction.textContent=
"Спокойно задержи дыхание.";

}

if(phase==="out"){

circle.className="circle out";
circle.textContent="Выдох";

phaseText.textContent="Выдох · 6 секунд";
instruction.textContent=
"Медленно и спокойно выдохни.";

}

document.getElementById("breathTimer").textContent=
"00:"+String(Math.max(0,breathSeconds)).padStart(2,"0");

if(breathSeconds<=0){

clearInterval(breathTimer);
breathRunning=false;

circle.className="circle";
circle.textContent="Готово";

phaseText.textContent=
"Практика завершена";

instruction.textContent=
"Сделай несколько спокойных обычных вдохов и выдохов.";

}

},1000)

}

function pauseBreath(){
breathRunning=!breathRunning
}


let breathAudio=null;
function toggleBreathSound(){
try{if(breathAudio){breathAudio.osc.stop();breathAudio.ctx.close();breathAudio=null;return}let ctx=new (window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator();let gain=ctx.createGain();osc.type='sine';osc.frequency.value=174;gain.gain.value=.025;osc.connect(gain).connect(ctx.destination);osc.start();breathAudio={ctx,osc};}catch(e){alert('Sound is not available in this browser.')}}
function stopBreath(){

clearInterval(breathTimer);
if(breathAudio){try{breathAudio.osc.stop();breathAudio.ctx.close()}catch(e){}breathAudio=null}
breathRunning=false;

let a=document.getElementById("breathArea");

if(a)a.innerHTML="";

}

function calculateMentalTest(){

let v=[0,1,2,3,4,5,6].map(i=>
Number(document.getElementById("mq"+i).value)
);

let score=Math.round(

(
v[0]+
v[1]+
(11-v[2])+
(11-v[3])+
v[4]+
v[5]+
(11-v[6])
)/7

);

let title;
let rec;

if(score>=7){

title="🟢 Состояние выглядит относительно стабильным";

rec=`

<p>
Сохраняй регулярность сна, питания и тренировок.
</p>

<p>
Следи за тем, чтобы нагрузка соответствовала
твоему восстановлению.
</p>

`;

}else if(score>=5){

title="🟡 Повышенная нагрузка";

rec=`

<p>
Обрати внимание на сон, восстановление,
питание и уровень стресса.
</p>

<p>
Попробуй короткую дыхательную практику
и оцени состояние позже.
</p>

`;

}else{

title="🔴 Высокое психофизическое напряжение";

rec=`

<p>
Сегодня приоритетом может быть восстановление,
сон, питание и снижение лишней нагрузки.
</p>

<p>
Если тяжёлое состояние сохраняется,
усиливается или мешает повседневной жизни,
обратись к специалисту.
</p>

`;

}

C().mentalData.tests.push({

date:new Date().toLocaleString("ru-RU"),
score:score,
values:v

});

save();

document.getElementById("mentalResult").innerHTML=`

<div class="card score">

<h3>${title}</h3>

<strong>${score}/10</strong>

${rec}

</div>
`
}

/* =========================
   CHART
========================= */

function drawChart(id,values){

let cv=document.getElementById(id);

if(!cv||!values.length)return;

let d=window.devicePixelRatio||1;

let w=cv.clientWidth;
let h=cv.clientHeight;

cv.width=w*d;
cv.height=h*d;

let g=cv.getContext("2d");

g.scale(d,d);

let min=Math.min(...values);
let max=Math.max(...values);

if(min===max){
min-=1;
max+=1
}

g.beginPath();

values.forEach((v,i)=>{

let x=
20+
(w-40)*
(values.length===1?.5:i/(values.length-1));

let y=
h-25-
(h-45)*(v-min)/(max-min);

if(i===0)g.moveTo(x,y);
else g.lineTo(x,y)

});

g.stroke();

values.forEach((v,i)=>{

let x=
20+
(w-40)*
(values.length===1?.5:i/(values.length-1));

let y=
h-25-
(h-45)*(v-min)/(max-min);

g.beginPath();

g.arc(x,y,4,0,Math.PI*2);

g.fill()

})

}

const fmOriginal=new WeakMap();
const fmAttrOriginal=new Map();
function fmTranslateText(text){let raw=text;let trimmed=raw.trim();let map=FM_TR[fmLang]||{};if(map[trimmed])return raw.replace(trimmed,map[trimmed]);if(fmLang==='en'){let ru=FM_TR.ru||{};for(const [en,ruText] of Object.entries(ru)){if(trimmed===ruText)return raw.replace(trimmed,en)}for(const [en,ruText] of Object.entries(ru)){if(en.length>3&&ruText&&raw.includes(ruText))raw=raw.split(ruText).join(en)}}else{for(const [en,to] of Object.entries(map)){if(en.length>3&&raw.includes(en))raw=raw.split(en).join(to)}}return raw}
function applyLanguage(){
 document.documentElement.lang=fmLang;
 document.querySelectorAll('#app *').forEach(el=>{if(el.id==='langSelect'||el.id==='publicLang')return;el.childNodes.forEach(n=>{if(n.nodeType===3){if(!fmOriginal.has(n))fmOriginal.set(n,n.nodeValue);n.nodeValue=fmTranslateText(fmOriginal.get(n));}});['placeholder','title','aria-label'].forEach(attr=>{if(el.hasAttribute&&el.hasAttribute(attr)){let key=el.tagName+'#'+(el.id||'')+'.'+attr;if(!fmAttrOriginal.has(key))fmAttrOriginal.set(key,el.getAttribute(attr));let val=fmAttrOriginal.get(key);el.setAttribute(attr,fmTranslateText(val));}})});
 let s=document.getElementById('langSelect')||document.getElementById('publicLang');if(s)s.value=fmLang;
}
function setLanguage(v){if(!['en','ru','et'].includes(v))v='en';fmLang=v;localStorage.setItem(FM_LANG_KEY,v);applyLanguage();}
const fmObserver=new MutationObserver(()=>{clearTimeout(window.__fmLangTimer);window.__fmLangTimer=setTimeout(applyLanguage,0)});
setTimeout(()=>{const app=document.getElementById('app');if(app)fmObserver.observe(app,{childList:true,subtree:true});applyLanguage()},0);

render();
setTimeout(applyLanguage,50);
