<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FitMind</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#20242c}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh}

.side{
position:fixed;left:0;top:0;bottom:0;width:245px;
background:#171b24;color:#fff;padding:20px 14px;overflow:auto
}
.logo{font-size:28px;font-weight:800;padding:0 10px 25px}
.logo b{color:#7693ff}
.nav button{
width:100%;padding:12px 10px;margin:3px 0;border-radius:9px;
background:transparent;color:#dfe3ec;text-align:left
}
.nav button:hover,.nav button.active{background:#2b3140;color:#fff}

.main{
margin-left:245px;width:calc(100% - 245px);
padding:28px;max-width:1500px
}
.top{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:24px
}
h1{margin:0 0 5px}
h2,h3{margin-top:0}
.muted{color:#747c89}

.card{
background:#fff;border:1px solid #e2e6eb;border-radius:16px;
padding:20px;margin-bottom:17px;
box-shadow:0 2px 8px #00000008
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:14px
}
.home{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px
}
.tile{
background:#fff;border:1px solid #e2e6eb;border-radius:16px;
padding:20px;min-height:130px;cursor:pointer
}
.tile:hover{box-shadow:0 7px 22px #00000012}
.tile i{font-style:normal;font-size:30px}
.tile strong{display:block;font-size:18px;margin:10px 0 5px}
.tile span{font-size:14px;color:#747c89}

.btn{
background:#edf0f4;color:#20242c;
padding:10px 14px;border-radius:9px;font-weight:700
}
.primary{background:#315efb;color:white}
.danger{background:#fde9eb;color:#a51f29}
.green{background:#e7f6ee;color:#17633c}
.dark{background:#202531;color:#fff}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.form{margin-bottom:13px}
.form label{
display:block;font-size:13px;font-weight:700;margin-bottom:5px
}
input,select,textarea{
width:100%;padding:10px;border:1px solid #d7dbe2;
border-radius:8px;background:white
}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}

.tabs{
display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px
}
.tabs button{
background:#e9edf2;padding:10px 14px;border-radius:8px
}
.tabs button.active{background:#315efb;color:white}

.notice{
padding:16px;border-radius:12px;
background:#f0f4ff;border-left:4px solid #315efb;
line-height:1.55
}
.warn{background:#fff7e5;border-left-color:#d99b18}
.help{background:#fff0f1;border-left-color:#d9363e}
.good{background:#e9f8ef;border-left-color:#249653}

.list{display:grid;gap:10px}
.item{
border:1px solid #e1e5ea;border-radius:12px;padding:14px
}
.itemhead{
display:flex;justify-content:space-between;gap:10px
}
.badge{
display:inline-block;padding:4px 8px;border-radius:20px;
background:#eef1f5;font-size:12px;font-weight:700
}
.badge.ok{background:#e7f6ee;color:#17633c}
.badge.bad{background:#fde9eb;color:#a51f29}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px
}
.stat{padding:15px;background:#f7f8fa;border-radius:11px}
.stat b{display:block;font-size:25px;margin-bottom:4px}
.empty{text-align:center;padding:30px;color:#777}

.login{max-width:430px;margin:9vh auto}

.breath{
min-height:430px;text-align:center;
display:flex;flex-direction:column;
align-items:center;justify-content:center
}
.circle{
height:180px;width:180px;border-radius:50%;
background:#e7ecff;
display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:22px;
transition:transform 1s ease
}
.circle.in{transform:scale(1.25)}
.circle.out{transform:scale(.82)}
.timer{font-size:40px;font-weight:800;margin:20px}
.phase{font-size:18px;font-weight:700;margin-bottom:18px}

.score{
text-align:center;background:#f2f5ff;
border-radius:14px;padding:25px
}
.score strong{font-size:52px}

.question{
padding:18px;background:#f8f9fb;
border-radius:12px;margin-bottom:12px
}
.rangeValue{
font-size:20px;font-weight:800;color:#315efb
}

table{
width:100%;border-collapse:collapse;min-width:700px
}
th,td{
padding:9px;border-bottom:1px solid #e5e7eb;
text-align:left;font-size:13px
}
th{background:#f7f8fa}

.chart{
width:100%;height:240px;
border:1px solid #e1e5ea;border-radius:12px
}

.post{
border:1px solid #e0e4ea;border-radius:13px;
padding:16px;margin-bottom:11px
}
.post img{
max-width:100%;max-height:330px;
border-radius:9px;margin-top:10px
}

.feature{
padding:18px;border-radius:13px;
background:#f8f9fb;margin-bottom:12px
}
.feature h3{margin-bottom:7px}

@media(max-width:800px){
.side{width:68px}
.logo{font-size:19px;padding-left:8px}
.logo b,.nav span{display:none}
.nav button{text-align:center}
.main{
margin-left:68px;width:calc(100% - 68px);
padding:16px
}
}
</style>
</head>

<body>
<div id="app"></div>

<script>

/* =========================
   DATABASE
========================= */

const DB="fitmind_v2_clients";
const SES="fitmind_v2_session";

let clients=JSON.parse(localStorage.getItem(DB)||"[]");
let session=JSON.parse(localStorage.getItem(SES)||"null");

let current=null;
let page="home";

let mentalTab="intro";
let recoveryTab="intro";
let progressTab="overview";

let breathTimer=null;
let breathRunning=false;
let breathSeconds=60;

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2)
}

function esc(x){
return String(x??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[c]))
}

function save(){
localStorage.setItem(DB,JSON.stringify(clients))
}

function prepare(c){

c.progressData ||= {
body:[],
strength:[],
cardio:[]
};

c.mentalData ||= {
entries:[],
tests:[]
};

c.training ||= [];

c.diary ||= [];

c.communityPosts ||= [];

c.nutrition ||= {
kcal:"",
protein:"",
fat:"",
carbs:"",
notes:""
};

c.paymentHistory ||= [];

return c
}

clients.forEach(prepare);
save();

function C(){
return clients.find(c=>c.id===current)
}


/* =========================
   LOGIN
========================= */

function loginScreen(){

document.getElementById("app").innerHTML=`

<div class="login card">

<h1>Fit<b style="color:#315efb">Mind</b></h1>

<p class="muted">
Тренировки · питание · восстановление · ментальное здоровье
</p>

<div class="form">
<label>Логин</label>
<input id="loginUser" value="trainer">
</div>

<div class="form">
<label>Пароль</label>
<input id="loginPass" type="password" value="1234">
</div>

<button class="btn primary"
style="width:100%"
onclick="login()">
Войти
</button>

<br><br>

<div class="notice">
<b>Демо-доступ тренера</b><br>
Логин: trainer<br>
Пароль: 1234
</div>

</div>
`
}

function login(){

let u=document.getElementById("loginUser").value.trim();
let p=document.getElementById("loginPass").value;

if(u==="trainer"&&p==="1234"){

session={role:"trainer"};
localStorage.setItem(SES,JSON.stringify(session));
render();
return
}

let c=clients.find(x=>x.username===u&&x.password===p);

if(c){

session={
role:"client",
clientId:c.id
};

current=c.id;

localStorage.setItem(
SES,
JSON.stringify(session)
);

render()

}else{

alert("Неверный логин или пароль")

}
}

function logout(){

localStorage.removeItem(SES);
session=null;
current=null;

location.reload()

}


/* =========================
   NAVIGATION
========================= */

function go(x){

page=x;

if(session?.role==="client"){
current=session.clientId
}

render()

}

function render(){

if(!session){
loginScreen();
return
}

if(session.role==="client"){
current=session.clientId
}

let nav=[

["home","🏠","Главная"],
["training","🏋️","Тренировки"],
["nutrition","🥗","Питание"],
["mental","🧠","Ментальное здоровье"],
["recovery","😴","Восстановление"],
["diary","📓","Дневник"],
["progress","📊","Прогресс"],
["calculators","🧮","Калькуляторы"],
["community","👥","Community"],
["clients","👤","Клиенты"],
["settings","⚙️","Настройки"]

];

if(session.role==="client"){
nav=nav.filter(x=>x[0]!=="clients")
}

let titles={
home:"Главная",
training:"Тренировки",
nutrition:"Питание",
mental:"Ментальное здоровье",
recovery:"Восстановление",
diary:"Дневник",
progress:"Прогресс",
calculators:"Калькуляторы",
community:"Community",
clients:"Клиенты",
settings:"Настройки"
};

document.getElementById("app").innerHTML=`

<div class="app">

<aside class="side">

<div class="logo">
Fit<b>Mind</b>
</div>

<div class="nav">

${nav.map(x=>`

<button
class="${page===x[0]?"active":""}"
onclick="go('${x[0]}')">

${x[1]} <span>${x[2]}</span>

</button>

`).join("")}

</div>

</aside>

<main class="main">

<div class="top">

<div>

<h1>${titles[page]}</h1>

<div class="muted">
${session.role==="trainer"
?"Панель тренера"
:"Личный кабинет клиента"}
</div>

</div>

<button class="btn" onclick="logout()">
Выйти
</button>

</div>

<div id="content"></div>

</main>

</div>
`;

pages()

}

function pages(){

let e=document.getElementById("content");

let functions={
home:homePage,
training:trainingPage,
nutrition:nutritionPage,
mental:mentalPage,
recovery:recoveryPage,
diary:diaryPage,
progress:progressPage,
calculators:calcPage,
community:communityPage,
clients:clientsPage,
settings:settingsPage
};

(function(){
functions[page]?.(e)
})()

}


/* =========================
   HOME
========================= */

function homePage(e){

let tiles=[

["🏋️","Тренировки",
"Персональные тренировочные программы",
"training"],

["🥗","Питание",
"Калории, КБЖУ и питание",
"nutrition"],

["🧠","Ментальное здоровье",
"Тесты, дыхание, дневник и помощь",
"mental"],

["😴","Восстановление",
"Сон, питание, стресс и восстановление",
"recovery"],

["📓","Дневник",
"Личные записи и самонаблюдение",
"diary"],

["📊","Прогресс",
"Измерения, сила и кардио",
"progress"],

["🧮","Калькуляторы",
"ИМТ и КБЖУ",
"calculators"],

["👥","Community",
"Общение, достижения и мотивация",
"community"]

];

e.innerHTML=`

<div class="card">

<h2>FitMind — целостный подход</h2>

<p>
Физическое и ментальное состояние связаны между собой.
Тренировки создают нагрузку, а сон, питание,
восстановление и психологическое состояние помогают
организму адаптироваться.
</p>

</div>

<div class="home">

${tiles.map(t=>`

<div class="tile" onclick="go('${t[3]}')">

<i>${t[0]}</i>

<strong>${t[1]}</strong>

<span>${t[2]}</span>

</div>

`).join("")}

</div>
`
}


/* =========================
   CLIENTS
========================= */

function clientsPage(e){

if(session.role==="client"){
e.innerHTML=`
<div class="card empty">
Раздел клиентов доступен только тренеру.
</div>
`;
return
}

e.innerHTML=`

<div class="actions" style="margin-bottom:15px">

<button class="btn primary"
onclick="clientForm()">
＋ Добавить клиента
</button>

</div>

<div class="list">

${clients.length?

clients.map(c=>`

<div class="card clienthead">

<div>

<h3>${esc(c.name||"Без имени")}</h3>

<div class="muted">
${esc(c.age||"—")} лет ·
${esc(c.gender||"—")} ·
${esc(c.goal||"Цель не указана")}
</div>

<p>

${c.payment==="Paid"

?'<span class="badge ok">Оплачено</span>'

:'<span class="badge bad">'+
esc(c.payment||"Не оплачено")+
'</span>'}

</p>

</div>

<div class="actions">

<button class="btn primary"
onclick="openClient('${c.id}')">
Открыть
</button>

<button class="btn"
onclick="editClient('${c.id}')">
✏️ Редактировать
</button>

<button class="btn danger"
onclick="delClient('${c.id}')">
Удалить
</button>

</div>

</div>

`).join("")

:

'<div class="card empty">Клиентов пока нет.</div>'

}

</div>
`
}

function field(label,id,value="",type=""){

return `

<div class="form">

<label>${label}</label>

<input
id="${id}"
type="${type||"text"}"
value="${esc(value)}">

</div>

`
}

function selectField(label,id,value,options){

return `

<div class="form">

<label>${label}</label>

<select id="${id}">

${options.map(o=>
`<option ${o===value?"selected":""}>
${o}
</option>`
).join("")}

</select>

</div>

`
}

function clientForm(id=""){

let c=id?clients.find(x=>x.id===id):{};

document.getElementById("content").innerHTML=`

<div class="card">

<h2>
${id?"✏️ Редактировать клиента":"＋ Новый клиент"}
</h2>

<div class="grid">

${field("Имя","cfname",c.name)}

${field("Возраст","cfage",c.age,"number")}

${selectField(
"Пол",
"cfgender",
c.gender,
["Мужской","Женский","Другое"]
)}

${field("Рост, см","cfheight",c.height,"number")}

${field("Вес, кг","cfweight",c.weight,"number")}

${field("Цель","cfgoal",c.goal)}

${selectField(
"Тренировочный пакет",
"cfplan",
c.plan,
["1 месяц","3 месяца","6 месяцев","Individual"]
)}

${field("Цена (€)","cfprice",c.price,"number")}

${selectField(
"Оплата",
"cfpay",
c.payment,
["Unpaid","Paid","Partially paid"]
)}

${field("Дата начала","cfstart",c.start,"date")}

${field("Дата окончания","cfend",c.end,"date")}

<div></div>

${field("Логин клиента","cfuser",c.username)}

${field("Пароль клиента","cfpass",c.password,"password")}

<div></div>

<div class="form full">

<label>Заметки</label>

<textarea id="cfnotes">${esc(c.notes)}</textarea>

</div>

</div>

<div class="actions">

<button class="btn primary"
onclick="saveClient('${id}')">
💾 Сохранить
</button>

<button class="btn"
onclick="go('clients')">
Отмена
</button>

</div>

</div>
`
}

function saveClient(id){

let c=id
?clients.find(x=>x.id===id)
:prepare({id:uid()});

Object.assign(c,{

name:document.getElementById("cfname").value,
age:document.getElementById("cfage").value,
gender:document.getElementById("cfgender").value,
height:document.getElementById("cfheight").value,
weight:document.getElementById("cfweight").value,
goal:document.getElementById("cfgoal").value,
plan:document.getElementById("cfplan").value,
price:document.getElementById("cfprice").value,
payment:document.getElementById("cfpay").value,
start:document.getElementById("cfstart").value,
end:document.getElementById("cfend").value,
username:document.getElementById("cfuser").value,
password:document.getElementById("cfpass").value,
notes:document.getElementById("cfnotes").value

});

if(!id)clients.push(c);

save();

current=c.id;

alert("Клиент сохранён");

go("clients")

}

function editClient(id){
clientForm(id)
}

function delClient(id){

if(confirm("Удалить клиента и все его данные?")){

clients=clients.filter(c=>c.id!==id);

save();

go("clients")

}
}

function openClient(id){

current=id;

let c=C();

document.getElementById("content").innerHTML=`

<div class="card">

<div class="itemhead">

<div>

<h2>${esc(c.name)}</h2>

<p class="muted">
${esc(c.age)} лет ·
${esc(c.gender)} ·
${esc(c.goal)}
</p>

</div>

<div class="actions">

<button class="btn"
onclick="editClient('${c.id}')">
✏️ Редактировать клиента
</button>

<button class="btn"
onclick="go('clients')">
← Клиенты
</button>

</div>

</div>

<hr>

<div class="stats">

<div class="stat">
<b>${esc(c.weight||"—")}</b>
кг
</div>

<div class="stat">
<b>${esc(c.height||"—")}</b>
см
</div>

<div class="stat">
<b>${esc(c.plan||"—")}</b>
пакет
</div>

<div class="stat">
<b>${esc(c.price||"—")}</b>
€
</div>

</div>

<br>

<div class="actions">

<button class="btn primary"
onclick="go('training')">
🏋️ Тренировки
</button>

<button class="btn primary"
onclick="go('nutrition')">
🥗 Питание
</button>

<button class="btn primary"
onclick="go('mental')">
🧠 Mental Health
</button>

<button class="btn primary"
onclick="go('progress')">
📊 Прогресс
</button>

</div>

</div>
`
}


/* =========================
   TRAINING
========================= */

function trainingPage(e){

if(session.role==="trainer"&&!C()){

e.innerHTML=`

<div class="card empty">
Сначала выберите клиента в разделе «Клиенты».
</div>

`;

return
}

let c=C();

if(!c)return;

e.innerHTML=`

<div class="card">

<h2>🏋️ Программа — ${esc(c.name)}</h2>

<div class="grid">

${field("День","tday","Понедельник")}

${field("Упражнение","tex")}

${field("Подходы","tsets","","number")}

${field("Повторения","treps","","number")}

${field("Вес, кг","tweight","","number")}

${field("Отдых, сек","trest","","number")}

${field("RPE","trpe","","number")}

<div class="form full">

<label>Заметки</label>

<textarea id="tnotes"></textarea>

</div>

</div>

<button class="btn primary"
onclick="addExercise()">
＋ Добавить упражнение
</button>

</div>

<div class="card">

<h3>Упражнения</h3>

<div class="list">

${c.training.length?

c.training.map((x,i)=>`

<div class="item">

<div class="itemhead">

<div>

<b>${esc(x.exercise)}</b>

<br>

<span class="muted">
${esc(x.day)} ·
${x.sets} × ${x.reps} ·
${x.weight||"—"} кг ·
RPE ${x.rpe||"—"}
</span>

<p>${esc(x.notes)}</p>

</div>

<div class="actions">

<button class="btn"
onclick="editExercise(${i})">
✏️
</button>

<button class="btn danger"
onclick="delExercise(${i})">
Удалить
</button>

</div>

</div>

</div>

`).join("")

:

'<div class="empty">Упражнений пока нет.</div>'

}

</div>

</div>
`
}

function addExercise(){

let c=C();

c.training.push({

day:document.getElementById("tday").value,
exercise:document.getElementById("tex").value,
sets:document.getElementById("tsets").value,
reps:document.getElementById("treps").value,
weight:document.getElementById("tweight").value,
rest:document.getElementById("trest").value,
rpe:document.getElementById("trpe").value,
notes:document.getElementById("tnotes").value

});

save();

trainingPage(document.getElementById("content"))

}

function editExercise(i){

let x=C().training[i];

document.getElementById("content").innerHTML=`

<div class="card">

<h2>✏️ Редактирование упражнения</h2>

<div class="grid">

${field("День","edday",x.day)}

${field("Упражнение","edex",x.exercise)}

${field("Подходы","edsets",x.sets,"number")}

${field("Повторения","edreps",x.reps,"number")}

${field("Вес","edweight",x.weight,"number")}

${field("Отдых","edrest",x.rest,"number")}

${field("RPE","edrpe",x.rpe,"number")}

<div class="form full">

<label>Заметки</label>

<textarea id="ednotes">${esc(x.notes)}</textarea>

</div>

</div>

<div class="actions">

<button class="btn primary"
onclick="saveExerciseEdit(${i})">
💾 Сохранить
</button>

<button class="btn"
onclick="trainingPage(document.getElementById('content'))">
Отмена
</button>

</div>

</div>
`
}

function saveExerciseEdit(i){

let x=C().training[i];

Object.assign(x,{

day:document.getElementById("edday").value,
exercise:document.getElementById("edex").value,
sets:document.getElementById("edsets").value,
reps:document.getElementById("edreps").value,
weight:document.getElementById("edweight").value,
rest:document.getElementById("edrest").value,
rpe:document.getElementById("edrpe").value,
notes:document.getElementById("ednotes").value

});

save();

function startBreath(type,name){

clearInterval(breathTimer);

breathSeconds=60;
breathRunning=true;

let area=document.getElementById("breathArea");

area.innerHTML=`

<div class="card breath">

<h2>${esc(name)}</h2>

<div class="circle in" id="breathCircle">
Вдох
</div>

<div class="timer" id="breathTimer">
01:00
</div>

<div class="phase" id="breathPhase">
Вдох · 4 секунды
</div>

<p id="breathInstruction">
Медленно вдохни через нос.
</p>

<div class="actions">

<button class="btn"
onclick="pauseBreath()">
Ⅱ Пауза
</button>

<button class="btn danger"
onclick="stopBreath()">
Остановить
</button>

</div>

<br>

<div class="notice">

🎵 <b>Фоновая музыка</b><br>
Аудиодорожку можно подключить на следующем этапе,
когда приложение будет работать с файлами на сервере.

</div>

</div>
`;

let cycle=12;
let elapsed=0;

breathTimer=setInterval(()=>{

if(!breathRunning)return;

breathSeconds--;
elapsed++;

let pos=(elapsed-1)%cycle;

let phase;

if(pos<4){

phase="in";

}else if(pos<6){

phase="hold";

}else{

phase="out";

}

let circle=document.getElementById("breathCircle");
let phaseText=document.getElementById("breathPhase");
let instruction=document.getElementById("breathInstruction");

if(!circle)return;

if(phase==="in"){

circle.className="circle in";
circle.textContent="Вдох";

phaseText.textContent="Вдох · 4 секунды";
instruction.textContent=
"Медленно вдохни через нос.";

}

if(phase==="hold"){

circle.className="circle";
circle.textContent="Задержка";

phaseText.textContent="Задержка · 2 секунды";
instruction.textContent=
"Спокойно задержи дыхание.";

}

if(phase==="out"){

circle.className="circle out";
circle.textContent="Выдох";

phaseText.textContent="Выдох · 6 секунд";
instruction.textContent=
"Медленно и спокойно выдохни.";

}

document.getElementById("breathTimer").textContent=
"00:"+String(Math.max(0,breathSeconds)).padStart(2,"0");

if(breathSeconds<=0){

clearInterval(breathTimer);
breathRunning=false;

circle.className="circle";
circle.textContent="Готово";

phaseText.textContent=
"Практика завершена";

instruction.textContent=
"Сделай несколько спокойных обычных вдохов и выдохов.";

}

},1000)

}

function pauseBreath(){
breathRunning=!breathRunning
}

function stopBreath(){

clearInterval(breathTimer);
breathRunning=false;

let a=document.getElementById("breathArea");

if(a)a.innerHTML="";

}

function mentalTest(e){

let questions=[

"Настроение",
"Энергия",
"Стресс",
"Тревожность",
"Качество сна",
"Мотивация",
"Физическая усталость"

];

e.innerHTML=`

<div class="card">

<h2>🧩 Тест текущего состояния</h2>

<p>
Оцени каждое состояние от 1 до 10.
Отвечай по тому, как ты чувствуешь себя сейчас.
</p>

${questions.map((q,i)=>`

<div class="question">

<label>
<b>${q}</b>
<span class="rangeValue" id="rv${i}">5</span>/10
</label>

<input
type="range"
min="1"
max="10"
value="5"
id="mq${i}"
oninput="
document.getElementById('rv${i}').textContent=this.value
">

</div>

`).join("")}

<button class="btn primary"
onclick="calculateMentalTest()">

function calculateMentalTest(){

let v=[0,1,2,3,4,5,6].map(i=>
Number(document.getElementById("mq"+i).value)
);

let score=Math.round(

(
v[0]+
v[1]+
(11-v[2])+
(11-v[3])+
v[4]+
v[5]+
(11-v[6])
)/7

);

let title;
let rec;

if(score>=7){

title="🟢 Состояние выглядит относительно стабильным";

rec=`

<p>
Сохраняй регулярность сна, питания и тренировок.
</p>

<p>
Следи за тем, чтобы нагрузка соответствовала
твоему восстановлению.
</p>

`;

}else if(score>=5){

title="🟡 Повышенная нагрузка";

rec=`

<p>
Обрати внимание на сон, восстановление,
питание и уровень стресса.
</p>

<p>
Попробуй короткую дыхательную практику
и оцени состояние позже.
</p>

`;

}else{

title="🔴 Высокое психофизическое напряжение";

rec=`

<p>
Сегодня приоритетом может быть восстановление,
сон, питание и снижение лишней нагрузки.
</p>

<p>
Если тяжёлое состояние сохраняется,
усиливается или мешает повседневной жизни,
обратись к специалисту.
</p>

`;

}

C().mentalData.tests.push({

date:new Date().toLocaleString("ru-RU"),
score:score,
values:v

});

save();

document.getElementById("mentalResult").innerHTML=`

<div class="card score">

<h3>${title}</h3>

<strong>${score}/10</strong>

${rec}

</div>
`
}

/* =========================
   CHART
========================= */

function drawChart(id,values){

let cv=document.getElementById(id);

if(!cv||!values.length)return;

let d=window.devicePixelRatio||1;

let w=cv.clientWidth;
let h=cv.clientHeight;

cv.width=w*d;
cv.height=h*d;

let g=cv.getContext("2d");

g.scale(d,d);

let min=Math.min(...values);
let max=Math.max(...values);

if(min===max){
min-=1;
max+=1
}

g.beginPath();

values.forEach((v,i)=>{

let x=
20+
(w-40)*
(values.length===1?.5:i/(values.length-1));

let y=
h-25-
(h-45)*(v-min)/(max-min);

if(i===0)g.moveTo(x,y);
else g.lineTo(x,y)

});

g.stroke();

values.forEach((v,i)=>{

let x=
20+
(w-40)*
(values.length===1?.5:i/(values.length-1));

let y=
h-25-
(h-45)*(v-min)/(max-min);

g.beginPath();

g.arc(x,y,4,0,Math.PI*2);

g.fill()

})

}

}
